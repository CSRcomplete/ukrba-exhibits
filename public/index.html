<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UKRBA Exhibits</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #000;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
      overscroll-behavior: none; touch-action: manipulation;
    }
    #tap { cursor: none; }
    #bg {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000;
    }
    #tap {
      position: fixed; inset: 0; background: transparent; border: 0;
      cursor: pointer; z-index: 5; width: 100%; height: 100%;
    }
    #hint {
      position: fixed; left: 50%; top: 3vh; transform: translateX(-50%);
      z-index: 6; pointer-events: none; color: #fff; text-align: center;
      white-space: nowrap; max-width: 94vw;
      font-size: clamp(.9rem, 2vw, 1.4rem); font-weight: 700; letter-spacing: .03em;
      padding: .5em 1.2em; border-radius: 999px;
      background: rgba(20,110,40,.85); box-shadow: 0 2px 10px rgba(0,0,0,.25);
      animation: pulse 2.2s ease-in-out infinite;
    }
    #hint.off { display: none; }
    @keyframes pulse {
      0%, 100% { opacity: .55; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }
    #overlay {
      position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(0,0,0,.7);
    }
    #overlay.open { display: flex; }
    #modal {
      width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto;
      background: #fff; color: #111; border-radius: 20px; padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: text;
    }
    h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 4vw, 2rem); }
    p.sub { margin: 0 0 20px; color: #555; font-size: 1.05rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid .full { grid-column: 1 / -1; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    input[type=text], input[type=email], input[type=tel] {
      width: 100%; font-size: 1.2rem; padding: 18px 20px; border-radius: 16px;
      border: 1.5px solid #111; background: #fff; color: #111;
    }
    input::placeholder { color: #b5b5b5; }
    input[type=text]:focus, input[type=email]:focus, input[type=tel]:focus { outline: none; border-width: 2.5px; padding: 17px 19px; }
    .check { display: flex; align-items: center; gap: 16px; margin: 0 0 18px; font-size: 1.1rem; line-height: 1.3; cursor: pointer; }
    .check input { appearance: none; -webkit-appearance: none; flex: none; width: 34px; height: 34px; margin: 0;
      border: 1.5px solid #111; border-radius: 10px; background: #fff; cursor: pointer; position: relative; }
    .check input:checked { background: #52a852; border-color: #52a852; }
    .check input:checked::after { content: ""; position: absolute; left: 11px; top: 5px; width: 9px; height: 17px;
      border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    #error {
      color: #b00020; background: #fdecee; border-radius: 10px;
      padding: 12px 14px; margin-top: 16px; font-size: 1.05rem; display: none;
    }
    #error.show { display: block; }
    .actions { display: flex; gap: 12px; margin-top: 22px; }
    button.btn {
      flex: 1; font-size: 1.25rem; font-weight: 700; padding: 18px; border-radius: 14px;
      border: 0; cursor: pointer; min-height: 60px;
    }
    #submit { background: #52a852; color: #fff; flex: 2; text-transform: uppercase; letter-spacing: .02em; }
    #submit:disabled { opacity: .6; cursor: default; }
    #cancel { background: #e7e9ee; color: #222; }
    #thanksScreen {
      position: fixed; inset: 0; z-index: 20; display: none; background: #fff;
      align-items: center; justify-content: center;
    }
    #thanksScreen.show { display: flex; }
    #thanksScreen img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <video id="bg" autoplay muted loop playsinline preload="auto"></video>
  <button id="tap" type="button" aria-label="Touch the screen to take the pledge"></button>
  <div id="hint">Touch the screen to take the pledge</div>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="title">
    <div id="modal">
      <form id="form" novalidate autocomplete="off">
        <h1 id="title">Make your pledge</h1>
        <p class="sub">Join the UKRBA Responsible Business Pledge.</p>

        <div class="grid">
          <input id="firstName" name="firstName" type="text" placeholder="First Name" aria-label="First name" autocomplete="given-name" required>
          <input id="surname" name="surname" type="text" placeholder="Surname" aria-label="Surname" autocomplete="family-name" required>
          <input id="businessName" name="businessName" type="text" placeholder="Business name" aria-label="Business name" autocomplete="organization">
          <input id="postcode" name="postcode" type="text" placeholder="Postcode" aria-label="Postcode" autocomplete="postal-code" autocapitalize="characters">
          <input id="email" name="email" class="full" type="email" inputmode="email" placeholder="Email address" aria-label="Email address" autocomplete="email" autocapitalize="off" required>
          <input id="phone" name="phone" class="full" type="tel" inputmode="tel" placeholder="Phone Number" aria-label="Phone number" autocomplete="tel">
        </div>

        <label class="check"><input type="checkbox" id="pledge" name="pledge"><span>I'd like to make the UKRBA Responsible Business Pledge.</span></label>
        <label class="check"><input type="checkbox" id="consent" name="consent"><span>I'm happy for UKRBA to contact me about my pledge, UKRBA Perks and relevant UKRBA opportunities. I can unsubscribe at any time.</span></label>

        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div id="error" role="alert"></div>

        <div class="actions">
          <button type="button" id="cancel" class="btn">Cancel</button>
          <button type="submit" id="submit" class="btn">Make my pledge</button>
        </div>
      </form>
    </div>
  </div>
  <div id="thanksScreen" aria-live="polite"><img src="/thank-you.png" alt="Thank you! You've just taken the first step on your Responsible Business Journey."></div>

  <script>
    (function () {
      var video = document.getElementById("bg");
      var overlay = document.getElementById("overlay");
      var modal = document.getElementById("modal");
      var form = document.getElementById("form");
      var errorBox = document.getElementById("error");
      var submitBtn = document.getElementById("submit");
      var INACTIVITY_MS = 60000, THANKS_MS = 6000;
      var thanksScreen = document.getElementById("thanksScreen");
      var idleTimer = null, thanksTimer = null, open = false, userPaused = false;

      fetch("/config").then(function (r) { return r.json(); })
        .then(function (c) {
          video.src = c.videoUrl || "/video.mp4";
          if (c.videoFit === "contain") video.style.objectFit = "contain";
          if (c.videoBackground) { video.style.background = c.videoBackground; document.body.style.background = c.videoBackground; }
          if (c.sound) { wantSound = true; video.muted = false; }
          if (c.showHint === false) document.getElementById("hint").classList.add("off");
          if (c.inactivitySeconds > 0) INACTIVITY_MS = c.inactivitySeconds * 1000;
          play();
        })
        .catch(function () { video.src = "/video.mp4"; play(); });

      // Keep the screen on for the whole event (Screen Wake Lock API, needs HTTPS).
      var wakeLock = null;
      function keepAwake() {
        if (!("wakeLock" in navigator) || document.hidden) return;
        navigator.wakeLock.request("screen").then(function (l) {
          wakeLock = l;
          l.addEventListener("release", function () { wakeLock = null; });
        }).catch(function () {});
      }
      keepAwake();
      document.addEventListener("visibilitychange", function () { if (!document.hidden && !wakeLock) keepAwake(); });
      setInterval(function () { if (!wakeLock) keepAwake(); }, 30000);

      // Go fullscreen on the first touch (browsers require a gesture). Not needed in --kiosk mode.
      function goFullscreen() {
        var el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen().catch(function () {});
        }
        if (!wakeLock) keepAwake();
      }

      // Refresh the page after long idle periods so updates arrive and any glitches clear.
      var loadedAt = Date.now();
      setInterval(function () {
        if (!open && Date.now() - loadedAt > 6 * 3600 * 1000) location.reload();
      }, 10 * 60 * 1000);

      var wantSound = false;
      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(function (err) {
          // Browser refused to autoplay with sound: fall back to muted until the first touch.
          if (wantSound && !video.muted) {
            video.muted = true;
            var q = video.play();
            if (q && q.catch) q.catch(function () {});
          }
        });
      }
      function unmute() {
        if (wantSound && video.muted) video.muted = false;
      }
      video.addEventListener("pause", function () {
        if (!userPaused && !document.hidden) setTimeout(play, 300);
      });
      video.addEventListener("ended", play);
      video.addEventListener("stalled", play);
      document.addEventListener("visibilitychange", function () { if (!document.hidden && !open) play(); });
      // Some browsers block autoplay until first interaction.
      document.addEventListener("pointerdown", function () { unmute(); if (!open && video.paused) play(); }, true);

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.toggle("show", !!msg);
      }

      function resetIdle() {
        clearTimeout(idleTimer);
        if (open) idleTimer = setTimeout(closeForm, INACTIVITY_MS);
      }

      function openForm() {
        if (open) return;
        goFullscreen();
        open = true;
        userPaused = true;
        video.pause();
        overlay.classList.add("open");
        resetIdle();
      }

      function closeForm() {
        open = false;
        clearTimeout(idleTimer);
        clearTimeout(thanksTimer);
        overlay.classList.remove("open");
        thanksScreen.classList.remove("show");
        form.reset();
        showError("");
        submitBtn.disabled = false;
        submitBtn.textContent = "Make my pledge";
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        userPaused = false;
        play();
      }

      document.getElementById("tap").addEventListener("click", openForm);
      document.getElementById("cancel").addEventListener("click", closeForm);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeForm(); });
      ["pointerdown", "keydown", "input", "touchstart", "scroll"].forEach(function (ev) {
        overlay.addEventListener(ev, resetIdle, true);
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        showError("");
        var data = {
          firstName: form.firstName.value.trim(),
          surname: form.surname.value.trim(),
          businessName: form.businessName.value.trim(),
          postcode: form.postcode.value.trim(),
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          pledge: form.pledge.checked,
          consent: form.consent.checked,
          website: form.website.value
        };
        if (!data.firstName) return showError("Please enter your first name.");
        if (!data.surname) return showError("Please enter your surname.");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showError("Please enter a valid email address.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";
        fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, body: j }; });
        }).then(function (res) {
          if (!res.ok || !res.body.ok) {
            throw new Error(res.body.error || "Something went wrong. Please try again.");
          }
          clearTimeout(idleTimer);
          thanksScreen.classList.add("show");
          thanksTimer = setTimeout(closeForm, THANKS_MS);
        }).catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Make my pledge";
          showError(err instanceof TypeError ? "Connection problem. Please check the network and try again." : err.message);
        });
      });
    })();
  </script>
</body>
</html>
